name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Engines require Node >= 22.18; cover the active LTS lines.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Reads the version from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - name: Get pnpm cache directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Audit production dependencies only: advisories in dev tooling (vitest,
      # tsup, typescript) never reach users of the published packages.
      - name: Audit production dependencies
        run: pnpm audit --prod

      # Offline examples run with no API key and no network — they prove the
      # engine's public surface actually works end to end.
      - name: Run offline examples
        run: |
          pnpm example:custom-provider
          pnpm example:workflows
          pnpm example:agent
          pnpm example:rag
